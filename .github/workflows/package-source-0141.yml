name: ROSS Studio 0.14.1 source package

on:
  push:
    branches:
      - feature/bearing-studio-light-workspace-0.14.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-linux-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q 'version = "0.14.1"' pyproject.toml
          grep -q '__version__ = "0.14.1"' src/ross_studio/__init__.py
          grep -q 'ross-rotordynamics==2.3.0' pyproject.toml

      - name: Create Linux command guide
        shell: bash
        run: |
          cat > /tmp/LINUX_COMMANDS.txt <<'EOF'
          ROSS Studio 0.14.1 - Linux (Ubuntu/Debian x86_64)
          ==================================================

          1) Prerequisites / Qt runtime libraries
          ---------------------------------------
          sudo apt update
          sudo apt install -y \
            python3 python3-venv python3-pip \
            libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 libtbb12

          2) Extract and enter project
          ----------------------------
          unzip ROSS-Studio-0.14.1-project-linux.zip
          cd ROSS-Studio-0.14.1

          3) Create isolated Python environment
          -------------------------------------
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

          4) Install ROSS Studio
          ----------------------
          python -m pip install -e .

          5) Run application
          ------------------
          ross-studio

          Alternative:
          python -m ross_studio.frozen_entry

          6) Development / qualification tests (optional)
          ------------------------------------------------
          source .venv/bin/activate
          python -m pip install -e ".[dev]"
          QT_QPA_PLATFORM=offscreen python -m pytest -q -ra

          Notes
          -----
          - Scientific dependency is pinned to ross-rotordynamics==2.3.0.
          - Do not install a different ROSS version over this environment.
          - For normal desktop use, do not set QT_QPA_PLATFORM=offscreen.
          - If the desktop is running through WSL, a working WSLg/X11 display is required.
          EOF

      - name: Build deterministic source archive layout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ROSS-Studio-0.14.1"
          mkdir -p "$ROOT"
          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'artifacts/' \
            --exclude '*.pyc'
          cp /tmp/LINUX_COMMANDS.txt "$ROOT/LINUX_COMMANDS.txt"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ROSS-Studio-0.14.1'
          payload = {
              'product': 'ROSS Studio',
              'version': '0.14.1',
              'ross_version': '2.3.0',
              'source_sha': os.environ['GITHUB_SHA'],
              'source_branch': os.environ['GITHUB_REF_NAME'],
              'target_environment': 'Linux / Ubuntu-Debian x86_64 source installation',
              'package_type': 'source-project',
          }
          (root / 'BUILD_INFO.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/ROSS-Studio-0.14.1-project-linux.zip" ROSS-Studio-0.14.1
          cd "$GITHUB_WORKSPACE"
          sha256sum ROSS-Studio-0.14.1-project-linux.zip > ROSS-Studio-0.14.1-project-linux.zip.sha256
          cp /tmp/LINUX_COMMANDS.txt ./ROSS-Studio-0.14.1-LINUX-COMMANDS.txt
          unzip -tq ROSS-Studio-0.14.1-project-linux.zip

      - name: Upload Linux source project
        uses: actions/upload-artifact@v4
        with:
          name: ROSS-Studio-0.14.1-project-linux
          path: |
            ROSS-Studio-0.14.1-project-linux.zip
            ROSS-Studio-0.14.1-project-linux.zip.sha256
            ROSS-Studio-0.14.1-LINUX-COMMANDS.txt
          if-no-files-found: error
          compression-level: 0
