name: core-tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile integration core
        run: python -m compileall -q src tests
      - name: Run isolated core tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0
      - name: Install UI smoke dependencies
        run: python -m pip install pytest "PySide6>=6.7"
      - name: Compile UI
        run: python -m compileall -q src tests
      - name: Run approved-layout smoke tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_ui_contract.py tests/test_ui_smoke.py tests/test_bearing_type_builders.py
