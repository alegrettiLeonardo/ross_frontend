name: core-tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest numpy
      - name: Compile integration core
        run: python -m compileall -q src tests tools
      - name: Run isolated core tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0
      - name: Install UI smoke dependencies
        run: python -m pip install pytest "PySide6>=6.7"
      - name: Compile UI
        run: python -m compileall -q src tests
      - name: Run approved-layout smoke tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_ui_contract.py tests/test_ui_smoke.py tests/test_bearing_type_builders.py tests/test_industrial_ui.py tests/test_response_ui.py

  test-vendored-ross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned ROSS commit
        run: |
          test "$(git -C vendor/ross rev-parse HEAD)" = "$(cat vendor/ross.PINNED_COMMIT)"
      - name: Install pinned ROSS and tests
        run: |
          python -m pip install pytest
          python -m pip install "plotly==5.24.1" -e ./vendor/ross
      - name: Run real ROSS smoke and industrial case tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_real_ross_smoke.py tests/test_legacy_irdin_case.py
      - name: Correlate W60 unbalance against RotorDin reference
        env:
          PYTHONPATH: src
        run: python tools/correlate_w60_unbalance.py
