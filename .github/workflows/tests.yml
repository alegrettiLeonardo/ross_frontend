name: ROSS Studio tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ROSS_STUDIO_DISABLE_WEBENGINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt headless system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Run tests
        run: python -m pytest -q -ra
      - name: Qualify UMP analytical and OP-W60 model
        run: python tools/qualify_ump.py
      - name: Qualify Concent mass and principal inertias
        run: python tools/qualify_concentrated.py
      - name: Qualify Bearing Studio General models
        run: python tools/qualify_bearing_studio.py
      - name: Qualify THD lateral bearing models
        run: python tools/qualify_thd_bearing_studio.py
      - name: Qualify ThrustPad axial model and strict assembly
        run: python tools/qualify_thrust_pad.py
      - name: Qualify Bearing Native Outputs 0.15.1
        run: python tools/qualify_bearing_native_outputs_0151.py
      - name: Qualify interactive engineering workspace and FE mesh
        run: python tools/qualify_workspace_012.py
      - name: Qualify Bearing Studio 2.0 station transaction isolation
        run: python tools/qualify_bearing_workspace.py
      - name: Qualify Complete Rotor Model Builder transactional core
        run: python tools/qualify_model_builder_014.py
      - name: Qualify ROSS guided shaft geometries
        run: python tools/qualify_shaft_geometry_018.py
      - name: Qualify 0.17 navigation architecture and strict rotor baseline
        run: python tools/qualify_navigation_017.py
      - name: Qualify Engineering Outputs 0.18 package
        run: python tools/qualify_engineering_outputs_018.py
      - name: Run production-resolution OP-W60 pipeline
        run: python tools/qualify_op_w60_pipeline.py
      - name: Enforce ROSS against regenerated RotorDin golden
        run: python tools/correlate_op_w60_rotordin.py --enforce
      - name: Isolate mesh and bearing-interpolation effects
        run: python tools/isolate_op_w60_response_differences.py
      - name: Isolate cross-coupling gyro phasor and RANUN conventions
        run: python tools/isolate_op_w60_conventions.py
      - name: Publish OP-W60 engineering qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-w60-pipeline-qualification
          path: |
            artifacts/ump_qualification.json
            artifacts/concentrated_mass_qualification.json
            artifacts/bearing_studio_qualification.json
            artifacts/thd_bearing_studio_qualification.json
            artifacts/thd_desktop_qualification.json
            artifacts/thrust_pad_qualification.json
            artifacts/thrust_pad_desktop_qualification.json
            artifacts/bearing_native_outputs_0151_qualification.json
            artifacts/workspace_012_qualification.json
            artifacts/bearing_workspace_qualification.json
            artifacts/model_builder_014_qualification.json
            artifacts/shaft_geometry_018_qualification.json
            artifacts/navigation_017_qualification.json
            artifacts/engineering_outputs_018_qualification.json
            artifacts/engineering_outputs_018/**
            artifacts/op_w60_pipeline_summary.json
            artifacts/op_w60_ross_vs_rotordin_correlation.json
            artifacts/op_w60_ross_vs_rotordin_correlation.csv
            artifacts/op_w60_response_ab_isolation.json
            artifacts/op_w60_convention_isolation.json
          if-no-files-found: ignore
