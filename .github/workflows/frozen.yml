name: ROSS Studio frozen executable

on:
  pull_request:
  push:
    branches:
      - feature/ross-architecture-0.17.0
      - feature/engineering-outputs-0.18.0
      - feature/static-modal-native-0.19.0
      - feature/static-modal-decoupled-0.20.0
      - feature/time-frequency-native-0.21.0
      - feature/stochastic-ross-0.22.0
      - feature/multirotor-ross-0.23.0
      - feature/foundation-studio-0.24.0
  workflow_dispatch:

jobs:
  frozen:
    name: frozen-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt headless system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install package and frozen-build dependencies
        run: python -m pip install -e ".[dev,package]"

      - name: Build production-style windowed executable
        run: python -m PyInstaller --clean --noconfirm packaging/ROSS-Studio.spec

      - name: Qualify exact frozen binary including project I/O, Engineering Outputs, Static/Modal 0.20, Time/Frequency 0.21, Stochastic 0.22 and MultiRotor 0.23 runtime
        run: python tools/qualify_frozen_binary.py dist artifacts/frozen_selftest_${{ runner.os }}.json

      - name: Qualify frozen MultiRotor 0.23 runtime
        run: python tools/qualify_frozen_multirotor_023.py dist artifacts/frozen_selftest_${{ runner.os }}_multirotor_023.json

      - name: Qualify frozen Foundation Studio 0.24 runtime
        run: python tools/qualify_frozen_foundation_024.py dist artifacts/frozen_selftest_${{ runner.os }}_foundation_024.json

      - name: Upload frozen executable and qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.24.0-${{ runner.os }}
          path: |
            dist/ROSS-Studio/
            artifacts/frozen_selftest_${{ runner.os }}.json
            artifacts/frozen_selftest_${{ runner.os }}_project_io.json
            artifacts/frozen_selftest_${{ runner.os }}_gui.json
            artifacts/frozen_selftest_${{ runner.os }}_engineering_outputs.json
            artifacts/frozen_selftest_${{ runner.os }}_static_modal_020.json
            artifacts/frozen_selftest_${{ runner.os }}_time_frequency_021.json
            artifacts/frozen_selftest_${{ runner.os }}_stochastic_022.json
            artifacts/frozen_selftest_${{ runner.os }}_multirotor_023.json
            artifacts/frozen_selftest_${{ runner.os }}_foundation_024.json
          if-no-files-found: error
