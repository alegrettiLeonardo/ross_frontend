name: ROSS Studio frozen executable

on:
  pull_request:
  workflow_dispatch:

jobs:
  frozen:
    name: frozen-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt headless system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 zip

      - name: Install package and frozen-build dependencies
        run: python -m pip install -e ".[dev,package]"

      - name: Build production-style windowed executable
        run: python -m PyInstaller --clean --noconfirm packaging/ROSS-Studio.spec

      - name: Qualify exact frozen binary
        run: python tools/qualify_frozen_binary.py dist artifacts/frozen_selftest_${{ runner.os }}.json

      - name: Create Linux distributable ZIP and transfer parts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/ROSS-Studio/QUALIFICATION artifacts
          cp artifacts/frozen_selftest_Linux.json dist/ROSS-Studio/QUALIFICATION/
          cp artifacts/frozen_selftest_Linux_gui.json dist/ROSS-Studio/QUALIFICATION/
          (cd dist && zip -r -9 -q ../artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip ROSS-Studio)
          split -b 200M -d -a 2 \
            artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip \
            artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip.part-
          sha256sum artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip \
            > artifacts/ROSS-Studio-0.14.0-Linux-x86_64.SHA256
          ls -lh artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip*

      - name: Create Windows distributable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ROSS-Studio\QUALIFICATION | Out-Null
          Copy-Item artifacts\frozen_selftest_Windows.json dist\ROSS-Studio\QUALIFICATION\
          Copy-Item artifacts\frozen_selftest_Windows_gui.json dist\ROSS-Studio\QUALIFICATION\
          Compress-Archive -Path dist\ROSS-Studio -DestinationPath artifacts\ROSS-Studio-0.14.0-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts\ROSS-Studio-0.14.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ROSS-Studio-0.14.0-Windows-x64.zip" | Set-Content artifacts\ROSS-Studio-0.14.0-Windows-x64.SHA256
          Get-Item artifacts\ROSS-Studio-0.14.0-Windows-x64.zip | Format-List Name,Length

      - name: Upload Linux transfer part 00
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.14.0-Linux-part-00
          path: artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip.part-00
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux transfer part 01
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.14.0-Linux-part-01
          path: artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip.part-01
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux transfer part 02
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.14.0-Linux-part-02
          path: artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip.part-02
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux transfer part 03
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.14.0-Linux-part-03
          path: artifacts/ROSS-Studio-0.14.0-Linux-x86_64.zip.part-03
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Linux ZIP checksum
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.14.0-Linux-checksum
          path: artifacts/ROSS-Studio-0.14.0-Linux-x86_64.SHA256
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows distributable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ross-studio-0.14.0-Windows-distributable
          path: |
            artifacts/ROSS-Studio-0.14.0-Windows-x64.zip
            artifacts/ROSS-Studio-0.14.0-Windows-x64.SHA256
          if-no-files-found: error
          compression-level: 0
