[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ross-studio"
version = "0.23.0"
description = "Rotordynamics Design Platform for Rotating Electrical Machines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "ross-rotordynamics==2.3.0",
  "numpy>=1.26,<2.5",
  "scipy>=1.11",
  "pandas>=2.0",
  "plotly==5.24.1",
  "pint>=0.22",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  # Kaleido 0.2.1 is retained on Linux/macOS, where the frozen export gate is
  # qualified.  On Windows its legacy subprocess protocol can hang indefinitely
  # in write_image() (including Python 3.12 / PyInstaller windowed executables).
  # 0.1.0.post1 is the established Windows fix for Plotly 5.x and preserves the
  # exact native Plotly figure -> PNG contract without bypassing static export.
  "kaleido==0.1.0.post1; sys_platform == 'win32'",
  "kaleido==0.2.1; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
package = ["pyinstaller>=6.16,<7"]

[project.scripts]
ross-studio = "ross_studio.frozen_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ross_studio"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
