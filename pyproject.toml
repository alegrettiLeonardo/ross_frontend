[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ross-frontend"
version = "0.1.0"
description = "Desktop engineering frontend for ROSS, migrated from the RotorDin workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ross-rotordynamics==2.3.0",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-qt>=4.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ross_frontend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["ross: requires the real ROSS package"]
