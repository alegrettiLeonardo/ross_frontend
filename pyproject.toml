[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ross-frontend"
version = "0.4.0"
description = "ROSS Studio desktop engineering frontend for ROSS rotordynamics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ross-rotordynamics==2.3.0",
  "plotly==5.24.1",
  "PySide6>=6.7",
]

[project.scripts]
ross-studio = "ross_frontend.ui.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-qt>=4.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ross_frontend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["ross: requires the real ROSS package"]
