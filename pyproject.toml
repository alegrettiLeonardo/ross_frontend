[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ross-studio"
version = "0.1.0"
description = "Desktop engineering UI for ROSS focused on rotating electrical machines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "ross-rotordynamics>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
ross-studio = "ross_studio.app:launch"

[tool.hatch.build.targets.wheel]
packages = ["src/ross_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
